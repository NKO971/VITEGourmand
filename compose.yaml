services:
  # L'application PHP/Apache, construite depuis Dockerfile
  web:
    build: .
    container_name: vitegourmand-web
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      TZ: Europe/Paris
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # La base de données MariaDB
  db:
    image: mariadb:11.4
    container_name: vitegourmand-db
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      TZ: Europe/Paris
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
      - ./database/privileges.sh:/docker-entrypoint-initdb.d/03-privileges.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: